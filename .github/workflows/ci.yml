name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --check
      - run: cargo clippy --all-targets --all-features -- -D warnings
      - run: cargo test --all-targets -- --test-threads=1

  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          components: llvm-tools-preview
      - uses: taiki-e/install-action@9458fed45835344deb5e69e06e831be047c96abf # cargo-llvm-cov
        with:
          tool: cargo-llvm-cov@0.8.7
      - run: cargo llvm-cov --all-targets --all-features --ignore-filename-regex 'tests/e2e/' --cobertura --output-path target/coverage.xml --fail-under-lines 90 -- --test-threads=1
      - run: python3 tools/check_changed_coverage.py target/coverage.xml origin/${{ github.base_ref || 'main' }} 90

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
      - run: make e2e
        env:
          FLOCAL_E2E_UPGRADE_FROM: ${{ github.event.pull_request.base.sha || github.event.before }}
      - name: Run upgrade E2E from the deployed alpha
        run: |
          tag=$(sed -n 's/^tag: //p' docs/deployed-alpha.org)
          commit=$(sed -n 's/^commit: //p' docs/deployed-alpha.org)
          test -n "$tag" && test -n "$commit"
          [[ "$tag" =~ ^alpha-deployed-[0-9]{8}-[0-9a-f]{7,40}$ ]]
          [[ "$commit" =~ ^[0-9a-f]{40}$ ]]
          test "$(git cat-file -t "refs/tags/$tag")" = tag
          test "$(git rev-parse "refs/tags/$tag^{commit}")" = "$commit"
          git merge-base --is-ancestor "$commit" HEAD
          test "$commit" != "$(git rev-parse HEAD)"
          FLOCAL_E2E_UPGRADE_FROM="$commit" make e2e
